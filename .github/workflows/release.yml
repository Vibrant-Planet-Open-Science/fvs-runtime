name: release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Upstream FVS release tag to build, e.g. 2027.1.1.
        default: "2027.1.1"
      revision:
        description: fvs-runtime revision R of that tag (0 for its first release).
        type: number
        default: 0
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src/**
      - templates/**
      - tools/**

permissions:
  contents: read

# Pull requests have no inputs, so each `with:` repeats the `source_ref` default.
jobs:
  linux-x86_64:
    uses: Vibrant-Planet-Open-Science/fvs-build/.github/workflows/build-native-linux.yml@v0.9.0
    with:
      source_repo: USDAForestService/ForestVegetationSimulator
      source_ref: ${{ inputs.source_ref || '2027.1.1' }}
      regression_tests: warn

  linux-aarch64:
    uses: Vibrant-Planet-Open-Science/fvs-build/.github/workflows/build-native-linux.yml@v0.9.0
    with:
      source_repo: USDAForestService/ForestVegetationSimulator
      source_ref: ${{ inputs.source_ref || '2027.1.1' }}
      regression_tests: warn
      arch: aarch64

  macos:
    uses: Vibrant-Planet-Open-Science/fvs-build/.github/workflows/build-native-macos.yml@v0.9.0
    with:
      source_repo: USDAForestService/ForestVegetationSimulator
      source_ref: ${{ inputs.source_ref || '2027.1.1' }}
      regression_tests: warn

  windows:
    uses: Vibrant-Planet-Open-Science/fvs-build/.github/workflows/build-native-windows.yml@v0.9.0
    with:
      source_repo: USDAForestService/ForestVegetationSimulator
      source_ref: ${{ inputs.source_ref || '2027.1.1' }}
      regression_tests: warn

  pack:
    needs: [linux-x86_64, linux-aarch64, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          pattern: fvs-native-*-${{ github.run_id }}
          path: bundles

      - name: Pack each bundle into a wheel
        env:
          REVISION: ${{ inputs.revision || 0 }}
          LINUX_X86_64: bundles/${{ needs.linux-x86_64.outputs.artifact_name }}
          LINUX_AARCH64: bundles/${{ needs.linux-aarch64.outputs.artifact_name }}
          MACOS: bundles/${{ needs.macos.outputs.artifact_name }}
          WINDOWS: bundles/${{ needs.windows.outputs.artifact_name }}
        run: |
          uv run --no-project tools/pack.py "$LINUX_X86_64" "$REVISION" linux_x86_64
          uv run --no-project tools/pack.py "$LINUX_AARCH64" "$REVISION" linux_aarch64
          uv run --no-project tools/pack.py "$MACOS" "$REVISION" macosx_15_0_arm64
          uv run --no-project tools/pack.py "$WINDOWS" "$REVISION" win_amd64

      # Artifacts named `wheel-*` are the wheels to publish.
      - uses: actions/upload-artifact@v7
        with:
          name: linux-unrepaired
          path: dist/*linux_*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-macos
          path: dist/*macosx_*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-windows
          path: dist/*win_amd64.whl

  # PyPI rejects `linux_*` wheels. The Linux libraries also link the
  # Fortran runtime dynamically, so auditwheel copies libgfortran into
  # the wheel and retags it manylinux_2_28. Only the manylinux image's
  # copy is old enough for that tag.
  repair-linux:
    needs: pack
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-unrepaired

      - run: >-
          auditwheel repair --plat manylinux_2_28_${{ matrix.arch }}
          --wheel-dir dist *linux_${{ matrix.arch }}.whl

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-manylinux-${{ matrix.arch }}
          path: dist/*.whl


  # Ends in a clean environment with only the wheel installed, so a
  # missing runtime library fails here rather than for a user.
  verify:
    needs: repair-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - wheel: manylinux-x86_64
            runner: ubuntu-24.04
            image: python:3.12-slim
          - wheel: manylinux-x86_64
            runner: ubuntu-24.04
            image: almalinux:8
          - wheel: manylinux-aarch64
            runner: ubuntu-24.04-arm
            image: python:3.12-slim
          - wheel: manylinux-aarch64
            runner: ubuntu-24.04-arm
            image: almalinux:8
          - wheel: macos
            runner: macos-15
          - wheel: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.wheel }}
          path: wheel

      - uses: astral-sh/setup-uv@v10.3.3

      - run: >-
          uv run --isolated --no-project --python 3.12
          --no-index --find-links wheel --with fvs-runtime tools/verify.py

  publish-pypi:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@v1.14.3
