version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      # One PR for everything: with "require branches to be up to date",
      # separate PRs each need a rebase and full CI run to merge.
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      dev:
        patterns: ["*"]
